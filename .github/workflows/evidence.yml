name: evidence
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The verifier must test the PR's own commit, not a synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck

      - name: shell syntax
        run: |
          for s in bin/al install.sh core/lib/*.sh core/cmd/*.sh \
                   core/templates/adapters/*.sh; do
            bash -n "$s" || exit 1
          done

      - name: shellcheck
        run: shellcheck -S warning -e SC1091,SC2317 \
               bin/al install.sh core/lib/*.sh core/cmd/*.sh || true

      - name: secret scan
        run: bash core/cmd/scan.sh .

      - name: .env safety
        run: |
          grep -qx '\.env' .gitignore || { echo "::error::.env not ignored"; exit 1; }
          grep -qx '!\.env\.example' .gitignore || { echo "::error::.env.example not whitelisted"; exit 1; }
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"; exit 1
          fi
          if grep -qE '(ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})' .env.example; then
            echo "::error::.env.example contains a credential"; exit 1
          fi

      - name: skill frontmatter
        run: |
          for s in skills/*/SKILL.md; do
            [ "$(head -c 3 "$s")" = "---" ] || { echo "::error::$s: frontmatter must start at byte 0"; exit 1; }
            grep -q '^name:' "$s" || { echo "::error::$s: missing name"; exit 1; }
            grep -q '^description:' "$s" || { echo "::error::$s: missing description"; exit 1; }
            d=$(basename "$(dirname "$s")")
            n=$(grep -m1 '^name:' "$s" | sed 's/^name: *//')
            [ "$d" = "$n" ] || { echo "::error::$s: name '$n' != directory '$d'"; exit 1; }
          done

      - name: installer smoke (sandboxed, never touches HOME)
        run: |
          SB=$(mktemp -d); mkdir -p "$SB/proj"
          box() {
            AL_CLAUDE_HOME="$SB/.claude" AL_CODEX_HOME="$SB/.codex" \
            AL_HERMES_HOME="$SB/.hermes" AL_OPENCODE_HOME="$SB/.config/opencode" \
            AL_CURSOR_DIR="$SB/proj/.cursor" AL_REPO_ROOT="$SB/proj" \
            AL_BIN_DIR=- ./install.sh "$@"
          }
          N=$(find skills -maxdepth 2 -name SKILL.md | grep -c '')
          box claude codex hermes opencode cursor agents
          got=$(find "$SB/.claude/skills" -maxdepth 1 -mindepth 1 | grep -c '')
          [ "$got" = "$N" ] || { echo "::error::installed $got of $N skills"; exit 1; }
          box claude codex hermes opencode cursor agents        # idempotent
          again=$(find "$SB/.claude/skills" -maxdepth 1 -mindepth 1 | grep -c '')
          [ "$again" = "$N" ] || { echo "::error::not idempotent: $again"; exit 1; }
          box --uninstall claude codex hermes opencode cursor agents
          left=$(find "$SB/.claude/skills" -maxdepth 1 -mindepth 1 2>/dev/null | grep -c '' || true)
          [ "$left" = 0 ] || { echo "::error::uninstall left $left"; exit 1; }

      - name: end-to-end gate on a scaffolded repo
        run: |
          AL=$PWD
          R=$(mktemp -d); cd "$R"; git init -q
          git config user.email ci@example.test; git config user.name ci
          printf '{"name":"t","scripts":{"test":"true","build":"true","lint":"true"}}\n' > package.json
          AL_HOME="$AL" "$AL/bin/al" init
          sed -i 's/approval_ref: PENDING/approval_ref: APR-CI/' .agent/acceptance-evidence.yaml
          git add -A && git commit -qm init
          AL_HOME="$AL" "$AL/bin/al" run smoke || true   # may write a lockfile
          git add -A && git commit -qm lock || true

          # PASS
          AL_HOME="$AL" "$AL/bin/al" run standard
          [ "$(AL_HOME="$AL" "$AL/bin/al" decision | cut -f1)" = PASS ] \
            || { echo "::error::expected PASS"; exit 1; }

          # FAIL = exit 1
          printf '#!/usr/bin/env bash\nexit 1\n' > scripts/evidence/test.sh
          set +e; AL_STRICT_WORKTREE=0 AL_HOME="$AL" "$AL/bin/al" run smoke; rc=$?; set -e
          [ "$rc" = 1 ] || { echo "::error::failing test should exit 1, got $rc"; exit 1; }

          # UNKNOWN = exit 2, and outranks FAIL
          rm scripts/evidence/test.sh
          set +e; AL_STRICT_WORKTREE=0 AL_HOME="$AL" "$AL/bin/al" run smoke; rc=$?; set -e
          [ "$rc" = 2 ] || { echo "::error::missing adapter should exit 2, got $rc"; exit 1; }

      - name: secrets never reach logs or artifacts
        run: |
          AL=$PWD
          R=$(mktemp -d); cd "$R"; git init -q
          git config user.email ci@example.test; git config user.name ci
          printf '{"name":"t","scripts":{"test":"echo tok=$GITHUB_TOKEN"}}\n' > package.json
          AL_HOME="$AL" "$AL/bin/al" init
          sed -i 's/approval_ref: PENDING/approval_ref: APR-CI/' .agent/acceptance-evidence.yaml
          git add -A && git commit -qm init
          FAKE="ghp_$(printf 'a%.0s' $(seq 36))"
          GITHUB_TOKEN="$FAKE" AL_STRICT_WORKTREE=0 AL_HOME="$AL" "$AL/bin/al" run smoke || true
          if grep -rqF "$FAKE" .agent/logs/ .agent/artifacts/ 2>/dev/null; then
            echo "::error::token leaked into evidence output"; exit 1
          fi
          grep -rq REDACTED .agent/logs/ || { echo "::error::no redaction marker found"; exit 1; }
